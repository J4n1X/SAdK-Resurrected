; mpsave: saving and loading in network matches (docs/multiplayer-save.md). Saving in a network match and loading
; such a save offline work (tested 2026-10-12); loading in a network match is not tested in its present form.
; A server mod: the host's copy, this file included, runs for everyone.
[MpSave]
; When the game reports a desync, the host saves its state and every player loads it. Off until plain save and
; load are tested in the game: it reloads the match for everyone.
AutoResync = false
; Loading a save in a network match: who continues which of the save's players. The host's value counts.
; true:  a player whose name is the name of a human player in the save continues that player, whatever seat (start
;        position) they took in the pre-game room. A player without such a name keeps the player of their seat, if
;        that is a human player of the save nobody else got. Names must match exactly; a name that two players
;        have counts as no match. If someone cannot be placed, the load is refused and the host is told who.
; false: seats only. Everyone continues the player of their seat; the save is refused unless every human's seat
;        is a human player of the save.
; Not tested in the game. A resync never changes who plays whom, with either value.
AssignByName = true
; true: the host refuses a save that was not made on this match's map, so a match and its saves stay on one map.
; false: any save loads (the load rebuilds the whole world from the save; this worked in the game), but the match
;        then still reports the map it was set up on to the lobby.
SameMapOnly = true
; Loading a network save offline (from the normal load menu): the players of the humans who are not there become
; AI players (ai) or stay without a controller (idle). The player who saved stays yours. Only saves of a network
; match are touched: a campaign's scripted party (also "remote human" in the file) stays the mission's.
FormerHumans = ai
; The AI level of those players, with FormerHumans = ai: 1, 2 or 3. These are the three AI difficulties of the
; game's own match setup, in the setup's order (1 = its first entry, 3 = its last). Any other value counts as 2.
; Has no effect in a network match, and none on players that were AI players in the save already.
AiLevel = 2
; Sending a save to the other players: bytes per piece (256 to 2900) and pieces per frame.
PieceBytes = 2100
PiecesPerFrame = 2
; The host gives up a load when not every player has the save after this many seconds.
TransferTimeoutSeconds = 120
; Autosave in network matches: every this many minutes of game time every player's game saves the match as
; "mpsave_auto <map> <h>h<mm>" (the game time of the save), all at the same moment of the match. After a crash, host
; the match again and load the newest one from the menu. 0: no autosave. The host's value counts.
AutosaveMinutes = 5
; How many autosaves stay in the saves folder (the newest, of any match; older ones are deleted).
AutosaveKeep = 6
