; navalcombatfix: soldiers cross the water through their own player's harbours (docs/navy-and-military.md §7).
; A server mod: every player of a match runs the host's copy, this file included (assetshare downloads the host's
; mod when any file of it differs from yours), so these settings are the host's for the whole match.
[NavalCombatFix]
; Attackers gather from buildings across the water through their own harbours: each building's soldiers sail from
; its nearest usable home harbour to a landing harbour near the target. Several home harbours, each with its own
; ship, can bring soldiers to the same landing harbour.
AttackersBySea = true
; Defenders from buildings across the water come by ship the same way, through their own harbours.
DefendersBySea = true
; A target is attackable when one of the attacker's harbours lies within its territory range + 1 (colonies), plus
; LandingReach.
AttackFromOwnLanding = true
; How far around a landing harbour targets can be attacked by sea, for every landing: an enemy harbour (the game's
; own case), an own harbour and a neutral one. The game's rule: the harbour lies within the target's territory
; range + 1 (10 to 12 cells: guard house and castle 9, tower 10, fortress 11). LandingReach adds cells to that;
; 9, the default, is as if a guard house stood at the landing. 0: the game's rule.
LandingReach = 9
; A ship picks up soldiers the game would let die for having nowhere to go, from a harbour on their landmass. Which
; harbours it may use (each level includes the ones before it):
;   own      - none: the game's own rule, soldiers only get home by sea through their own harbours
;   neutral  - harbours whose flag stands on nobody's land
;   friendly - also harbours of team mates
;   all      - also enemy harbours
ValidRetreatHarbors = neutral
; Routes between two of a player's own harbours count for the distance to the enemy: the flag stripes, soldier
; upgrades and whether a building can be attacked.
ProximityOverOwnRoutes = true
; A neutral harbour serves as a landing (attacks, and the distance to the enemy) where an expedition would find no
; room for its colony building; with room, found a colony there instead.
NeutralLandings = true
; Cells a sea crossing counts as, added to the land distances (soldier count and the distance to the enemy).
; 0: the crossing is free. The game's soldier count falls to 0 at 24 cells in total.
CrossingDistance = 0
; Ticks a pickup ship waits at the harbour for its soldiers before it leaves with whoever is aboard.
PickupTimeout = 1200
; An attack by sea that is lost (the target still stands, not taken) sinks the attacker's ship at the landing, with
; everything aboard; soldiers still ashore are left behind. Every attack by sea, the game's own and naval invasions.
; false: the ship sails home as usual (an invasion also unloads its expedition cargo).
; A ship carrying defenders sinks when the defence is lost together with the harbour it landed them at.
ShipLostOnDefeat = false
; An enemy harbour must be guarded: a street on land from its flag to one of its owner's finished military buildings
; whose territory range reaches the harbour (occupied or not; sea streets do not count). An expedition to an unguarded enemy harbour waits for orders as at a
; free harbour, and "Found colony" takes the land the colony needs: the guard post, its flag, and the street from the
; harbour with a cell on each side. The enemy's harbour flag and streets on that land are removed, and so are enemy
; military buildings within 4 cells of the guard post if nothing else leaves room for it. A naval invasion's
; colony takes its land the same way when a third player holds or contests the harbour.
; false: the game's rule, an owned harbour cannot be colonised.
HarborMustHaveGarrison = true
; A fight over a route that has no ship of the player, when the player has no idle ship either, takes the player's
; nearest ship from another sea street; the ship goes back to its street after the fight. That street has no
; transport meanwhile. false: such a fight needs an idle ship, as in the game.
BorrowStreetShips = true
