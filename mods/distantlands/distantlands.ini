; distantlands mod: the camera zooms out further, and the distance fog starts and ends further away.
[DistantLands]
; MaxZoom: the highest zoom step of the mouse wheel. The game's own value is 4; one step is 21 units of distance.
MaxZoom = 12
; StartZoom: the zoom step when a match starts (the game's own value is 3). 0 = half of MaxZoom.
StartZoom = 0
; FogFactor: both fog distances are multiplied by this. 1 = the game's own fog, 20 = barely visible.
FogFactor = 20
